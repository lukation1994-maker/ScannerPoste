name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compila APK (debug, installabile)
        run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Pubblica come release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScannerPoste.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScannerPoste.apk --title "Scanner Poste (ultima build)" --notes "APK debug generato automaticamente."
